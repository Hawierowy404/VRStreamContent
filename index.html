<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRStreamConrtent</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header>
 <div class="identity"><img class="logo" src="assets/logo.png" alt=""><div><div class="brand">VRStreamConrtent</div><p data-i18n="tagline"></p></div></div>
 <div class="header-tools"><button id="settings-open" class="info-button" aria-haspopup="dialog" aria-controls="preferences-dialog"><span aria-hidden="true">⚙</span><span data-i18n="preferences"></span></button><button id="info" class="info-button" aria-haspopup="dialog" aria-controls="help-dialog"><span class="info-icon" aria-hidden="true">i</span><span data-i18n="info"></span></button></div>
</header>
<button id="updates-alert" class="secondary wide" hidden></button><div class="intro"><div><p class="eyebrow" data-i18n="studio"></p><h1 data-i18n="heading"></h1><p class="subheading" data-i18n="intro"></p></div><span id="badge" role="status"></span></div>
<div class="workspace">
 <div class="setup-column">
  <section class="panel source-panel"><div class="section-title"><h2><span class="step">1</span><span data-i18n="choose"></span></h2><button id="refresh" class="text-button" data-i18n="refresh"></button></div><p class="section-hint" data-i18n="chooseHint"></p><div id="sources" class="sources"></div><p class="hint" data-i18n="switchSourceHint"></p></section>
  <section class="panel settings-panel"><div class="section-title"><h2><span class="step">2</span><span data-i18n="settingsTitle"></span></h2><span class="tiny-label" data-i18n="settingsOptional"></span></div>
   <label for="profile" data-i18n="profileLabel"></label><select id="profile"><option value="custom" data-i18n="profileCustom"></option><option value="weak" data-i18n="profileWeak"></option><option value="standard" data-i18n="profileStandard"></option><option value="best" data-i18n="profileBest"></option></select><p id="fourk-hint" class="hint" data-i18n="fourkHint" hidden></p><div class="options"><label><span data-i18n="quality"></span><select id="quality"><option value="480">SD · 480p</option><option value="720">HD · 720p</option><option value="1080">Full HD · 1080p</option><option value="1440">2K · 1440p</option><option value="2160">4K · 2160p</option></select></label><label><span data-i18n="frameRate"></span><select id="fps"><option value="15">15 FPS</option><option value="30">30 FPS</option><option value="60">60 FPS</option></select></label></div>
   <p class="hint quality-hint" data-i18n="qualitySimple"></p><div class="latency-control"><label for="yt-latency" data-i18n="latencySlider"></label><output id="yt-latency-value" for="yt-latency"></output><input id="yt-latency" type="range" min="0" max="2" step="1" value="0"><p class="hint" data-i18n="latencySliderHint"></p></div><details class="latency-details"><summary data-i18n="latencyTitle"></summary><p class="hint latency-note" data-i18n="latencyHint"></p></details>
   <button id="apply-quality" class="secondary wide" disabled data-i18n="applyVideo" hidden></button>
  </section>

 </div>
 <div class="broadcast-column">
  <section class="panel broadcast-panel"><div class="section-title"><h2 data-i18n="preview"></h2><span class="tiny-label" data-i18n="previewMuted"></span></div>
   <div class="preview"><video id="preview" autoplay muted playsinline></video><img id="selected-preview" alt="" hidden><div id="placeholder"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="9" width="36" height="25" rx="4"/><path d="M18 41h12M24 34v7m-3-24 8 5-8 5z"/></svg><span data-i18n="placeholder"></span></div></div>
   <div class="selection-line"><span class="source-dot" aria-hidden="true"></span><span id="selected-name"></span></div>
   <div class="live-telemetry"><span id="live-time">00:00</span><span id="live-fps">— FPS</span><span id="live-health" role="status"></span></div><div class="level-row"><span data-i18n="meterLabel"></span><meter id="audio-meter" min="0" max="1" value="0"></meter><button id="mute-live" class="secondary" disabled data-i18n="muteLive"></button></div><p class="hint" data-i18n="fpsHint"></p><div class="broadcast-actions"><p id="status" role="status" aria-live="polite"></p><button id="start" class="primary" disabled><span aria-hidden="true">↗</span><span data-i18n="start"></span></button><button id="stop" class="danger" disabled hidden data-i18n="stop"></button></div>
  </section>
  <section class="panel link-panel"><div class="section-title"><h2><span class="step">3</span><span data-i18n="watch"></span></h2></div><div class="link-row"><input id="url" readonly><button id="copy" class="secondary" disabled data-i18n="copy"></button></div><p class="hint" data-i18n="linkSimple"></p><button id="open-watch" class="text-button" disabled data-i18n="openWatch"></button></section>
 </div>
</div>
  <section class="panel audio-panel"><div class="section-title"><h2 data-i18n="audioSettings"></h2></div>
   <label class="audio-control"><span><strong data-i18n="audio"></strong><span id="audio-summary" class="hint"></span></span><input type="checkbox" id="audio" checked role="switch"></label>
   <div class="volume-control"><label for="stream-volume" data-i18n="streamVolume"></label><output id="volume-value" for="stream-volume">100%</output><input id="stream-volume" type="range" min="0" max="100" step="1" value="100"><p class="hint" data-i18n="streamVolumeHint"></p></div><p id="audio-route" class="hint route-message" role="status"></p>
   <button id="apply-audio" class="secondary wide" disabled data-i18n="applyAudio"></button><p id="audio-applied" class="hint" role="status"></p>
  </section>
<details class="advanced panel"><summary><span data-i18n="advancedTitle"></span><span class="details-plus" aria-hidden="true">+</span></summary><div class="advanced-body"><section class="sync-panel"><label for="offset" data-i18n="sync"></label><div class="offset-row"><input id="offset" type="range" min="-10000" max="10000" step="100" value="0"><output id="offset-value" for="offset">0 ms</output><button id="reset-offset" class="text-button">0 ms</button></div><p class="hint" data-i18n="syncHint"></p></section><div class="diagnostic-row"><div><strong data-i18n="troubleTitle"></strong><p class="hint" data-i18n="diagnosticsHint"></p></div><button id="support" class="secondary" data-i18n="supportDiscord" disabled></button><button id="diagnostics" class="secondary" data-i18n="diagnostics"></button><span id="diagnostics-result" role="status"></span></div></div></details>
<footer><span class="footer-dot" aria-hidden="true"></span><span data-i18n="privacySimple"></span><button id="terms-open" class="text-button" data-i18n="termsTitle"></button><span class="version">v1.4.0</span></footer>
</main>
<dialog id="help-dialog" aria-labelledby="help-title"><div class="help-header"><div><p class="eyebrow" data-i18n="helpEyebrow"></p><h2 id="help-title" data-i18n="helpTitle"></h2></div><button id="help-close" class="close-button" autofocus><span data-i18n="close"></span><span aria-hidden="true">×</span></button></div><div class="help-content"><section class="activation-note"><h3 data-i18n="ytActivationTitle"></h3><p data-i18n="ytActivationHelp"></p><button class="text-button" data-external="youtubeStudio">YouTube Studio ↗</button></section><ol class="quick-start"><li><strong data-i18n="helpStep1Title"></strong><p data-i18n="helpStep1"></p></li><li><strong data-i18n="helpStep2Title"></strong><p data-i18n="helpStep2"></p></li><li><strong data-i18n="helpStep3Title"></strong><p data-i18n="helpStep3"></p></li></ol><h3 data-i18n="helpTopics"></h3>
<details class="help-topic"><summary data-i18n="helpSourceTitle"></summary><p data-i18n="helpSource"></p></details>
<details class="help-topic"><summary data-i18n="helpQualityTitle"></summary><p data-i18n="helpQuality"></p></details>
<details class="help-topic"><summary data-i18n="helpAudioTitle"></summary><p data-i18n="helpAudio"></p></details>
<details class="help-topic"><summary data-i18n="helpLinkTitle"></summary><p data-i18n="helpLink"></p></details>
<details class="help-topic"><summary data-i18n="helpSyncTitle"></summary><p data-i18n="helpSync"></p></details>
<details class="help-topic"><summary data-i18n="helpProblemsTitle"></summary><p data-i18n="helpProblems"></p></details>
<details class="help-topic"><summary data-i18n="helpPrivacyTitle"></summary><p data-i18n="helpPrivacy"></p></details>
</div><div class="help-footer"><span data-i18n="helpOffline"></span><button id="help-done" class="primary" data-i18n="helpDone"></button></div></dialog>
<dialog id="preferences-dialog" aria-labelledby="preferences-title"><div class="help-header"><h2 id="preferences-title" data-i18n="preferences"></h2><button id="settings-close" class="close-button"><span data-i18n="close"></span><span aria-hidden="true">×</span></button></div><div class="preferences-body"><label for="language" data-i18n="language"></label><div class="language-control"><span class="sr-only" data-i18n="language"></span><select id="language" hidden aria-hidden="true" tabindex="-1"></select><div id="settings-language-picker"></div></div><section class="youtube-settings"><h3>YouTube</h3><p class="hint" data-i18n="ytExplanation"></p><details class="help-topic"><summary data-i18n="ytActivationTitle"></summary><p data-i18n="ytActivationHelp"></p><button class="text-button" data-external="youtubeStudio">YouTube Studio ↗</button></details><p id="yt-account" role="status"></p><button id="yt-connect" class="secondary" data-connected="false" data-i18n="ytConnect"></button> <button id="yt-disconnect" class="text-button" data-i18n="ytDisconnect" hidden></button><label for="provider" data-i18n="ytDestination"></label><select id="provider"><option value="tunnel" data-i18n="ytTunnel"></option><option value="youtube" data-i18n="ytUnlisted"></option></select><label for="yt-title" data-i18n="ytTitle"></label><input id="yt-title" maxlength="100" value="VRStreamConrtent Live"><label for="yt-kids" data-i18n="ytAudience"></label><select id="yt-kids"><option value="" data-i18n="ytChoose"></option><option value="no" data-i18n="ytNotKids"></option><option value="yes" data-i18n="ytKids"></option></select><p class="hint" data-i18n="ytNotice"></p></section><section class="update-settings"><h3 data-i18n="updatesTitle"></h3><label for="update-repo" data-i18n="repoLabel"></label><input id="update-repo" placeholder="owner/repository"><label><input type="checkbox" id="update-auto"><span data-i18n="updateAuto"></span></label><button id="update-check" class="secondary" data-i18n="updateCheck"></button><button id="update-download" class="text-button" hidden data-i18n="updateDownload"></button><p id="update-result" role="status"></p><p id="shortcut-status" class="hint" data-i18n="shortcutsHint"></p></section><fieldset class="theme-options"><legend data-i18n="theme"></legend><label><input type="radio" name="theme" value="dark" checked><span data-i18n="themeDark"></span></label><label><input type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label><label><input type="radio" name="theme" value="rgb"><span data-i18n="themeRgb"></span></label><label><input type="radio" name="theme" value="rainbow" aria-describedby="rainbow-warning rainbow-description"><span data-i18n="themeRainbow"></span></label></fieldset><p id="rainbow-description" class="hint" data-i18n="rainbowDescription">Tryb dla „im fust as fuck boy”</p><p id="rainbow-warning" class="theme-warning" data-i18n="themeWarning"></p><button id="motion-stop" class="secondary" data-i18n="stopColors"></button></div></dialog>
<dialog id="terms-dialog" aria-labelledby="terms-title"><div class="help-header"><h2 id="terms-title" data-i18n="termsTitle"></h2><div id="terms-language-picker"></div></div><div class="help-content legal-content" tabindex="0"><p id="terms-version"></p><div id="terms-body"></div><div class="legal-links"><button class="text-button" data-external="youtubeTerms">YouTube Terms of Service ↗</button><button class="text-button" data-external="googlePrivacy">Google Privacy Policy ↗</button><button class="text-button" data-external="googleAccess">Google · Access ↗</button><button class="text-button" data-external="youtubeStudio">YouTube Studio ↗</button><button class="text-button" data-external="localhostPrivacy">localhost.run · Security ↗</button><button class="text-button" data-external="cloudflarePrivacy">Cloudflare · Privacy ↗</button></div></div><div class="legal-actions"><label id="terms-check-row"><input id="terms-check" type="checkbox"><span data-i18n="termsAgree"></span></label><p id="terms-error" role="alert"></p><div><button id="terms-decline" class="secondary" data-i18n="termsDecline"></button><button id="terms-accept" class="primary" disabled data-i18n="termsAccept"></button><button id="terms-close" class="secondary" hidden data-i18n="close"></button></div></div></dialog>
<script src="i18n.js"></script><script src="video-settings.js"></script><script src="app-audio.js"></script><script src="capture.js"></script><script src="youtube-i18n.js"></script><script src="extra-i18n.js"></script><script src="legal-i18n.js"></script><script src="features-i18n.js"></script><script src="output-i18n.js"></script><script src="youtube-latency.js"></script><script src="latency-i18n.js"></script><script src="renderer.js"></script><script src="preferences.js"></script><script src="legal-ui.js"></script><script src="features.js"></script><script src="output-ui.js"></script><script src="latency-ui.js"></script>
</body></html>
